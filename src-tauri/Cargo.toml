[package]
name = "quran-widget"
version = "0.1.0"
description = "Simak: widget yang menampilkan ayat Al-Qur'an yang sedang dibacakan di Spotify"
authors = ["Simak contributors"]
repository = "https://github.com/OWNER/simak-ayat"
edition = "2021"
default-run = "quran-widget"
rust-version = "1.88"

[lib]
name = "quran_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "quran-widget"
path = "src/main.rs"

[[bin]]
name = "dump_titles"
path = "src/bin/dump_titles.rs"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2"
