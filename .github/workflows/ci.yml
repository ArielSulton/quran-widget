# Pemeriksaan pada setiap push ke main dan setiap pull request.
# Kebijakan pin: semua aksi pihak ketiga dipin ke SHA commit lengkap (komentar menyebut versinya).
# Tes alat Python (tools/) sengaja TIDAK dijalankan di sini: butuh model dan jaringan.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npx tsc --noEmit

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Paket sistem (Tauri + D-Bus untuk MPRIS)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev patchelf
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tauri-build memeriksa folder frontendDist saat kompilasi.
      - run: npm run build
      # Catatan: di lokal dipakai CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback karena toolchain
      # lokal Rust 1.88; di CI toolchain dipatok ke Rust 1.99.1 (stable per 2026-10-15) supaya lint
      # clippy baru tidak tiba-tiba menggagalkan CI; naikkan versinya dengan sengaja.
      # Aksinya dipin ke SHA commit cabang `stable` milik dtolnay; versi ditentukan input `toolchain`.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch "stable" (commit pinned 2026-11-06)
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked -p quran-widget
      # Alat pengembang (dump_titles, accuracy_probe) ada di examples/; tesnya tidak ikut `cargo test` biasa.
      - name: cargo test (examples)
        working-directory: src-tauri
        run: cargo test --locked -p quran-widget --examples
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  # Memastikan sumber pemutaran macOS/Windows dapat dikompilasi dan tes murninya lulus secara
  # native di tiap OS. Kode panggilan OS (osascript / WinRT SMTC) hanya terbukti kompilasi;
  # perilaku sebenarnya diukur manual dengan `accuracy_probe` di mesin asli.
  cross-os-check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tauri-build memeriksa folder frontendDist saat kompilasi.
      - run: npm run build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch "stable" (commit pinned 2026-11-06)
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked -p quran-widget --lib --bins --examples
      - name: cargo test (playback)
        working-directory: src-tauri
        run: cargo test --locked -p quran-widget --lib "playback::"
      - name: cargo test (examples)
        working-directory: src-tauri
        run: cargo test --locked -p quran-widget --examples
