<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Quran Widget</title>
  </head>
  <body>
    <main id="widget" data-tauri-drag-region>
      <div id="content" data-tauri-drag-region>
        <div id="arabic" dir="rtl" lang="ar" data-tauri-drag-region></div>
        <div id="translation" data-tauri-drag-region></div>
      </div>
      <div id="footer" data-tauri-drag-region></div>

      <!-- Kontrol: tersembunyi sampai kursor di atas jendela / fokus papan ketik. -->
      <div id="controls" role="toolbar" aria-label="Kontrol widget">
        <div class="group" id="theme-group" role="group" aria-label="Tema">
          <button type="button" class="seg" data-theme-choice="auto" aria-pressed="false" aria-label="Tema otomatis (ikuti sistem)" title="Otomatis (ikuti sistem)">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.25" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M8 2.75a5.25 5.25 0 0 1 0 10.5z" fill="currentColor" /></svg>
          </button>
          <button type="button" class="seg" data-theme-choice="light" aria-pressed="false" aria-label="Tema terang" title="Terang">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.7" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M8 1.6v1.5M8 12.9v1.5M1.6 8h1.5M12.9 8h1.5M3.5 3.5l1.05 1.05M11.45 11.45l1.05 1.05M3.5 12.5l1.05-1.05M11.45 4.55l1.05-1.05" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
          </button>
          <button type="button" class="seg" data-theme-choice="dark" aria-pressed="false" aria-label="Tema gelap" title="Gelap">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 9.9A5.6 5.6 0 0 1 6.1 2.8a5.6 5.6 0 1 0 7.1 7.1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" /></svg>
          </button>
        </div>

        <span class="divider" aria-hidden="true"></span>

        <div class="group" id="sync-group" role="group" aria-label="Geser sinkron" title="Geser sinkron: tambah jika ayat muncul lebih cepat dari suara, kurangi jika terlambat. Tahan Shift untuk langkah 1 detik">
          <button type="button" class="step" id="sync-dec" aria-label="Kurangi geser sinkron 0,1 detik (Shift: 1 detik)" title="Kurangi 0,1 dtk. Tahan Shift untuk langkah 1 detik. Pintasan: [">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
          </button>
          <button type="button" class="value" id="sync-value" title="Klik dua kali (atau tekan Enter) untuk mengatur ulang ke 0">0,0 dtk</button>
          <button type="button" class="step" id="sync-inc" aria-label="Tambah geser sinkron 0,1 detik (Shift: 1 detik)" title="Tambah 0,1 dtk. Tahan Shift untuk langkah 1 detik. Pintasan: ]">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8M8 4v8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
          </button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
