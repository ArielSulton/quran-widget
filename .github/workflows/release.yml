# Rilis: dipicu oleh tag `v*` (mis. `git tag v0.1.0 && git push origin v0.1.0`).
#
# Secara bawaan (push tag) HANYA build Linux (ubuntu-22.04) yang dibuat. Itulah satu-satunya build
# yang sumber pemutarannya sudah diverifikasi di mesin asli. Sumber pemutaran macOS (osascript) dan
# Windows (SMTC) sudah diimplementasikan tetapi BELUM diverifikasi di mesin asli (baru terbukti
# kompilasi dan tes murni di CI), jadi installer macOS/Windows bersifat eksperimental dan tidak
# dibuat pada rilis biasa. Untuk membuatnya: Actions > Release > "Run workflow", pilih TAG (bukan
# cabang) pada "Use workflow from", lalu centang `include_experimental`.
#
# Hasilnya adalah RILIS DRAFT di https://github.com/ArielSulton/quran-widget/releases . Draft tidak
# terlihat publik; pemilik repositori menerbitkannya secara manual setelah memeriksa lampirannya.
#
# Belum diverifikasi: workflow ini belum pernah dijalankan.
#
# TANPA penandatanganan kode: tidak ada secret yang dirujuk. Artinya bagi pengguna:
#   - macOS: Gatekeeper menolak membuka aplikasi tak bertanda/tak ternotarisasi sampai pengguna
#     mengizinkannya manual (Pengaturan Sistem > Privasi & Keamanan > "Tetap Buka").
#   - Windows: SmartScreen menampilkan "Windows protected your PC" (Info lebih lanjut > Tetap jalankan).
#   - Linux: tidak terpengaruh.
# Untuk menandatangani nanti, tambahkan secret repositori dan buka komentar pada bagian `env:` langkah
# tauri-action di bawah (lihat https://v2.tauri.app/distribute/sign/macos/ dan .../windows/).
#
# Kebijakan pin: semua aksi pihak ketiga dipin ke SHA commit lengkap (komentar menyebut versinya);
# dtolnay/rust-toolchain dipin ke commit cabang `stable` dan versi Rust ditentukan input `toolchain`.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      include_experimental:
        description: "Sertakan build macOS dan Windows (eksperimental, belum diverifikasi di mesin asli)"
        type: boolean
        default: false

permissions:
  contents: write # membuat rilis dan mengunggah lampiran

jobs:
  # Menyusun matriks: Linux selalu; macOS (universal) dan Windows hanya bila diminta lewat
  # workflow_dispatch. `matrix` tidak bisa dipakai di `if:` tingkat job, jadi matriksnya dibuat di sini.
  plan:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          INCLUDE_EXPERIMENTAL: ${{ inputs.include_experimental }}
        run: |
          linux='{"platform":"ubuntu-22.04","args":"","rust-targets":""}'
          mac='{"platform":"macos-latest","args":"--target universal-apple-darwin","rust-targets":"aarch64-apple-darwin,x86_64-apple-darwin"}'
          win='{"platform":"windows-latest","args":"","rust-targets":""}'
          if [ "$INCLUDE_EXPERIMENTAL" = "true" ]; then
            echo "matrix={\"include\":[$linux,$mac,$win]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$linux]}" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Pastikan dijalankan dari tag
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          echo "Jalankan workflow ini dari sebuah tag v* (bukan cabang)." >&2
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Pastikan tabel waktu ayat ada
        shell: bash
        run: |
          if ! ls data/timing/*.json >/dev/null 2>&1; then
            echo "data/timing/*.json belum ada: rilis tanpa tabel waktu tidak berguna." >&2
            exit 1
          fi

      - name: Paket sistem (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev patchelf

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # Tag vX.Y.Z harus sama dengan versi di tauri.conf.json, package.json, dan Cargo.toml.
      - name: Pastikan tag cocok dengan versi aplikasi
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          conf_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          pkg_version="$(node -p "require('./package.json').version")"
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)"
          echo "tag=$tag_version tauri.conf.json=$conf_version package.json=$pkg_version Cargo.toml=$crate_version"
          status=0
          for v in "$conf_version" "$pkg_version" "$crate_version"; do
            if [ "$v" != "$tag_version" ]; then status=1; fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Versi tag ($tag_version) harus sama dengan versi di ketiga berkas." >&2
            exit 1
          fi

      # Rust 1.99.1 (sama dengan ci.yml). CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback hanya diperlukan di
      # mesin lokal dengan Rust 1.88; di CI Cargo.lock yang dikomit dipakai apa adanya.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch "stable" (commit pinned 2026-11-06)
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: npm ci

      # tauri-action v0.6.2 (dipin ke SHA commit tag tersebut)
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Penandatanganan (BELUM dikonfigurasi; buka komentar setelah secret dibuat) ---
          # macOS (sertifikat Developer ID + notarisasi):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: konfigurasi bundle.windows.signCommand / sertifikat sesuai dokumentasi Tauri.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Simak ${{ github.ref_name }}"
          releaseBody: |
            Simak ${{ github.ref_name }} (pra-rilis).
            Sumber pemutaran Linux diverifikasi di satu mesin (X11/GNOME); installer belum pernah dicoba. Build macOS dan Windows (bila ada di rilis ini) bersifat eksperimental: dukungan pemutarannya sudah diimplementasikan tetapi belum diverifikasi di mesin asli.
            Installer belum ditandatangani: macOS Gatekeeper dan Windows SmartScreen akan menampilkan peringatan.
            Lihat README untuk batasan lengkap.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
          # Catatan: tauri-action tidak membuat berkas checksum. Hitung sendiri sebelum menerbitkan,
          # mis. `sha256sum Simak_* > SHA256SUMS` lalu unggah ke rilis draft.
